[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vidanalytics"
version = "0.2.0"
description = "FFmpeg + YOLO26 video analytics pipeline for NVIDIA DGX Spark (GB10)"
requires-python = ">=3.10"
# ultralytics / torch / opencv / tensorrt come from the NVIDIA ARM64 base image on purpose:
# do NOT let pip replace the CUDA-enabled torch build.
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
